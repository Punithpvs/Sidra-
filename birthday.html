<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday!</title>
<style>
:root{--a:#ff4d8d;--b:#ffb347;--c:#5b7cff;--bg:#02030a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:#fff;font-family:'Poppins','Segoe UI',sans-serif}
#sky{position:fixed;inset:0;z-index:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
.hide{opacity:0;pointer-events:none}

/* ---------- SLIDESHOW ---------- */
#show{perspective:1200px;overflow:hidden;z-index:10}
.title{font-family:Georgia,serif;font-size:clamp(1.5rem,7.5vw,4rem);text-align:center;margin-bottom:clamp(12px,3dvh,22px);padding:0 12px;
 background:linear-gradient(90deg,var(--b),var(--a),var(--c),var(--b));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 6px 18px rgba(255,77,141,.45))}
@keyframes shine{to{background-position:300% 0}}
.slot{width:clamp(160px,min(66vw,40dvh),380px);aspect-ratio:4/5;position:relative;transform-style:preserve-3d}
.slide{position:absolute;inset:0;border-radius:22px;overflow:hidden;border:3px solid rgba(255,255,255,.35);
 background:linear-gradient(135deg,var(--c),var(--a));box-shadow:0 0 50px rgba(255,77,141,.55),0 30px 60px rgba(0,0,0,.6);opacity:0;transition:box-shadow .4s,border-color .4s}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.slide:hover{border-color:var(--b);box-shadow:0 0 70px var(--b),0 30px 60px rgba(0,0,0,.6)}
.slide:hover img{transform:scale(1.12)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-130%);transition:transform .8s}
.slide:hover::after{transform:translateX(130%)}
.dots{display:flex;gap:8px;margin-top:22px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);transition:.4s}
.dots i.on{background:var(--a);box-shadow:0 0 12px var(--a);transform:scale(1.4)}
.skip{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 18px;border-radius:30px;cursor:pointer;backdrop-filter:blur(6px);transition:.3s}
.skip:hover{background:var(--a);box-shadow:0 0 20px var(--a)}

/* ---------- FINALE ---------- */
#fin{z-index:5;overflow:hidden}
.bg{position:absolute;inset:-10%;perspective:1000px;display:flex;align-items:center}
.rows{width:100%;display:flex;flex-direction:column;gap:18px;transform:rotateX(14deg) rotateZ(-6deg) scale(1.15);opacity:.55}
.row{display:flex;width:max-content;gap:18px;animation:left var(--t,40s) linear infinite}
.row.rev{animation-name:right}
@keyframes left{to{transform:translateX(-50%)}}
@keyframes right{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.mc{width:clamp(110px,16vw,190px);aspect-ratio:4/5;border-radius:14px;overflow:hidden;flex:none;border:2px solid rgba(255,255,255,.2);background:linear-gradient(135deg,var(--c),var(--a));transition:transform .4s,filter .4s;filter:brightness(.8)}
.mc img{width:100%;height:100%;object-fit:cover;display:block}
.mc:hover{transform:scale(1.2);filter:brightness(1.2);border-color:var(--b)}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(2,5,20,.85) 15%,rgba(2,5,20,.3) 65%,rgba(2,5,20,.65));pointer-events:none}
.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:12px 14px;max-width:100%;max-height:100dvh;overflow-y:auto;scrollbar-width:none}
.heartWrap{perspective:900px;position:relative}
.mini{position:absolute;width:var(--w);aspect-ratio:1/.95;left:var(--x);top:var(--y);translate:-50% -50%;transform:scale(0);cursor:pointer;z-index:2;
 filter:drop-shadow(0 0 10px rgba(91,160,255,.9)) drop-shadow(0 6px 10px rgba(0,0,0,.6));transition:scale .35s,filter .35s}
.scatter{position:absolute;inset:0;z-index:1;pointer-events:none}
.mini{pointer-events:auto}
.scatter.in .mini{animation:mpop .7s var(--d) cubic-bezier(.2,1.4,.4,1) forwards,bob var(--f) calc(var(--d) + .7s) ease-in-out infinite alternate}
@keyframes mpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes bob{from{translate:-50% -50%}to{translate:-50% calc(-50% - 12px)}}
.mini:hover{scale:1.5;z-index:4;filter:drop-shadow(0 0 18px #ff4d8d) drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.heart{width:clamp(170px,min(60vw,36dvh),400px);aspect-ratio:1/.95;position:relative;transform-style:preserve-3d;transition:transform .15s;cursor:pointer;
 filter:drop-shadow(0 0 25px rgba(255,77,141,.85)) drop-shadow(0 20px 30px rgba(0,0,0,.6));transform:scale(0)}
.heart.in{animation:pop 1.2s cubic-bezier(.2,1.4,.4,1) forwards,beat 1.6s 1.2s ease-in-out infinite}
@keyframes pop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
@keyframes beat{0%,100%{scale:1}15%{scale:1.06}30%{scale:1}45%{scale:1.05}}
.heart:hover{animation-play-state:paused}
.shape{position:absolute;inset:0;clip-path:url(#heartClip);background:linear-gradient(135deg,var(--a),var(--c));overflow:hidden}
.shape img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.heart:hover img{transform:scale(1.12)}
.shape::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-130%);animation:sweep 4s infinite}
@keyframes sweep{60%,100%{transform:translateX(130%)}}
.msg{max-width:700px;text-align:center;margin-top:clamp(16px,3.5dvh,40px);padding:12px 16px;background:rgba(2,5,20,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:20px;opacity:0;transition:opacity 1s}
.msg.in{opacity:1}
.msg h2{font-family:Georgia,serif;font-size:clamp(1.3rem,6vw,2.6rem);margin-bottom:8px;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.msg p{font-size:clamp(.86rem,3.4vw,1.2rem);line-height:1.6;color:#f6ecff;text-shadow:0 2px 12px #000;min-height:5.5em}
.btns{display:flex;gap:12px;justify-content:center;margin-top:10px}
.btn{border:0;cursor:pointer;color:#fff;font-size:.95rem;padding:12px 26px;border-radius:40px;background:linear-gradient(90deg,var(--a),var(--c));box-shadow:0 10px 30px rgba(255,77,141,.5);transition:.3s}
.btn:hover{transform:translateY(-4px) scale(1.07);box-shadow:0 0 40px var(--a)}

/* ---------- start gate + music button ---------- */
#start{z-index:100;text-align:center;padding:20px;background:radial-gradient(circle at center,rgba(8,24,106,.55),rgba(1,2,10,.96) 70%);backdrop-filter:blur(4px)}
#start .gift{font-size:clamp(4rem,18vw,7rem);animation:gift 1.6s ease-in-out infinite;filter:drop-shadow(0 0 30px var(--a))}
@keyframes gift{0%,100%{transform:translateY(0) rotate(-6deg) scale(1)}50%{transform:translateY(-14px) rotate(6deg) scale(1.1)}}
#start h2{font-family:Georgia,serif;font-size:clamp(1.4rem,6vw,2.6rem);margin:10px 0 22px;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
#go{border:0;cursor:pointer;color:#fff;font-size:1.05rem;padding:15px 34px;border-radius:40px;background:linear-gradient(90deg,var(--a),var(--c));box-shadow:0 0 30px rgba(255,77,141,.6);transition:.3s;animation:pulse 1.8s infinite}
#go:hover{transform:scale(1.1);box-shadow:0 0 50px var(--a)}
@keyframes pulse{50%{box-shadow:0 0 55px rgba(91,124,255,.9)}}
#start small{display:block;margin-top:14px;opacity:.65}
#mute{position:fixed;left:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:80;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);backdrop-filter:blur(6px);color:#fff;font-size:1.2rem;cursor:pointer;transition:.3s;display:none}
#mute:hover{background:var(--a);box-shadow:0 0 20px var(--a);transform:scale(1.12)}
#mute.on{display:block}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>
<svg width="0" height="0" style="position:absolute"><defs>
<clipPath id="heartClip" clipPathUnits="objectBoundingBox">
<path d="M0.5,0.95 C0.1,0.68 0,0.48 0,0.29 C0,0.11 0.12,0 0.27,0 C0.38,0 0.46,0.06 0.5,0.15 C0.54,0.06 0.62,0 0.73,0 C0.88,0 1,0.11 1,0.29 C1,0.48 0.9,0.68 0.5,0.95Z"/>
</clipPath></defs></svg>

<audio id="bgm" loop preload="auto"></audio>
<button id="mute" aria-label="Toggle music">🔊</button>
<div class="screen" id="start">
  <div class="gift">🎁</div>
  <h2 id="sh"></h2>
  <button id="go">Tap to open 🎶</button>
  <small>Sound on for the best experience</small>
</div>

<!-- 1) photo swipe slideshow -->
<div class="screen" id="show">
  <div class="title" id="title"></div>
  <div class="slot" id="slot"></div>
  <div class="dots" id="dots"></div>
  <button class="skip" id="skip">Skip ›</button>
</div>

<!-- 2) heart finale with marquee behind -->
<div class="screen hide" id="fin">
  <div class="bg"><div class="rows" id="rows"></div></div>
  <div class="veil"></div>
  <div class="scatter" id="sc"></div>
  <div class="content">
    <div class="heartWrap" id="hw"><div class="heart" id="heart"><div class="shape"><img id="heartImg" alt=""></div></div></div>
    <div class="msg" id="msg">
      <h2 id="mh"></h2>
      <p id="mp"></p>
    </div>
  </div>
</div>

<script>
/* ========== EDIT HERE ========== */
const NAME   = "My Dear Friend";
const PHOTOS = ["p1.jpg","p2.jpg","p3.jpg","p4.jpg","p5.jpg"];   // any number of photos
const HEART_PHOTO = "p1.jpg";            // photo inside the heart
const AUDIO = "a.mp3";                // your music file (same folder). Also works with .wav / .ogg / .m4a
const MUSIC_VOLUME = 0.7;                // 0 to 1
const HOLD_MS = 650;                    // how long each photo stays on screen
const MESSAGE = `Wishing you a day filled with laughter, love and all the things that make you smile. Thank you for being such a wonderful friend — may this year bring you every dream you've been chasing. Stay amazing, always! 💖`;
/* =============================== */

const $ = id => document.getElementById(id), sleep = ms => new Promise(r=>setTimeout(r,ms));
const cols=['#ff4d8d','#ffb347','#7b5cff','#2ee6a6','#4db8ff'];
const noimg = e => e.target.removeAttribute('src');
$('title').innerHTML = "Happy Birthday<br>"+NAME+"! 🎂";
$('mh').textContent = "Happy Birthday, "+NAME+" 🎂";

// build slides + dots
const slot=$('slot'), dots=$('dots');
const slides = PHOTOS.map(src=>{
  const d=document.createElement('div'); d.className='slide';
  const im=new Image(); im.src=src; im.alt=''; im.onerror=noimg; d.appendChild(im); slot.appendChild(d);
  const dt=document.createElement('i'); dots.appendChild(dt); return d; });

// background marquee rows (alternate directions)
const rows=$('rows');
for(let i=0;i<5;i++){
  const row=document.createElement('div'); row.className='row'+(i%2?' rev':''); row.style.setProperty('--t',(32+i*5)+'s');
  const list=PHOTOS.map((_,k)=>PHOTOS[(k+i)%PHOTOS.length]);
  const set=[...list,...list,...list,...list];
  [...set,...set].forEach(src=>{ const c=document.createElement('div'); c.className='mc';
    const im=new Image(); im.src=src; im.alt=''; im.onerror=noimg; c.appendChild(im); row.appendChild(c); });
  rows.appendChild(row);
}
$('heartImg').src=HEART_PHOTO; $('heartImg').onerror=noimg;

// slideshow: odd photos swipe in from the right, even from the left
let run=0;
async function play(){
  const id=++run; const W=innerWidth*1.1;
  $('show').classList.remove('hide'); $('fin').classList.add('hide');
  $('heart').classList.remove('in'); $('sc').classList.remove('in'); $('msg').classList.remove('in'); $('mp').textContent='';
  for(let i=0;i<slides.length;i++){
    if(id!==run) return;
    const s=slides[i], dir=(i%2===0)?1:-1;           // 1 = from right, -1 = from left
    [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
    s.style.opacity=1;
    await s.animate([
      {transform:`translateX(${dir*W}px) rotateY(${-dir*70}deg) scale(.7)`,opacity:0},
      {transform:'translateX(0) rotateY(0) scale(1)',opacity:1}],
      {duration:550,easing:'cubic-bezier(.2,.9,.3,1.1)',fill:'forwards'}).finished.catch(()=>{});
    await sleep(HOLD_MS); if(id!==run) return;
    await s.animate([
      {transform:'translateX(0) rotateY(0) scale(1)',opacity:1},
      {transform:`translateX(${-dir*W}px) rotateY(${dir*70}deg) scale(.7)`,opacity:0}],
      {duration:450,easing:'ease-in',fill:'forwards'}).finished.catch(()=>{});
    s.style.opacity=0;
  }
  if(id===run) finale();
}
async function finale(){
  run++; $('show').classList.add('hide'); $('fin').classList.remove('hide');
  await sleep(500); $('heart').classList.add('in'); layoutMinis(); $('sc').classList.add('in'); burst(innerWidth/2,innerHeight/3);
  await sleep(900); $('msg').classList.add('in'); type();
}
let tt; function type(){ clearInterval(tt); let i=0; $('mp').textContent='';
  tt=setInterval(()=>{ $('mp').textContent=MESSAGE.slice(0,++i); if(i>=MESSAGE.length) clearInterval(tt); },35); }

// 3D tilt on heart
const h=$('heart');
h.addEventListener('mousemove',e=>{const r=h.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;h.style.transform=`rotateY(${x*30}deg) rotateX(${-y*30}deg)`;});
h.addEventListener('mouseleave',()=>h.style.transform='');
h.addEventListener('click',e=>burst(e.clientX,e.clientY));
$('skip').onclick=finale;

// confetti
const cv=$('fx'),cx=cv.getContext('2d');let ps=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(x,y){for(let i=0;i<130;i++){const a=Math.random()*6.28,s=4+Math.random()*10;ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:3+Math.random()*5,c:cols[i%5],l:120+Math.random()*60,rot:Math.random()*6})}}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l>0);
 ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.l--;p.rot+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
 requestAnimationFrame(loop)})();

// little photo hearts scattered all over the screen (avoiding the big heart)
function layoutMinis(){
  const sc=$('sc'); sc.innerHTML='';
  const W=innerWidth,H=innerHeight, hr=$('hw').getBoundingClientRect(), pad=16;
  const target=Math.max(10,Math.min(26,Math.round(W*H/28000)));
  const minD=Math.max(64,Math.sqrt(W*H/target)*.8), pts=[];
  for(let t=0;t<600&&pts.length<target;t++){
    const x=30+Math.random()*(W-60), y=30+Math.random()*(H-60);
    if(x>hr.left-pad-20&&x<hr.right+pad+20&&y>hr.top-pad-20&&y<hr.bottom+pad+20) continue;
    if(pts.some(q=>Math.hypot(q[0]-x,q[1]-y)<minD)) continue;
    pts.push([x,y]);
  }
  const off=Math.floor(Math.random()*PHOTOS.length);
  pts.forEach(([x,y],i)=>{
    const m=document.createElement('div'); m.className='mini'; const sc_=(.8+Math.random()*.5).toFixed(2);
    m.style.setProperty('--x',x+'px'); m.style.setProperty('--y',y+'px');
    m.style.setProperty('--w',`calc(clamp(38px,9vw,66px)*${sc_})`);
    m.style.setProperty('--d',(i*0.07)+'s'); m.style.setProperty('--f',(2+Math.random()*2)+'s');
    const sh=document.createElement('div'); sh.className='shape';
    const im=new Image(); im.src=PHOTOS[(i+off)%PHOTOS.length]; im.alt=''; im.onerror=noimg;
    sh.appendChild(im); m.appendChild(sh); m.addEventListener('click',e=>burst(e.clientX,e.clientY)); sc.appendChild(m);
  });
}
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!$('fin').classList.contains('hide'))layoutMinis()},250)});

// starry night sky with blue glow
const sk=$('sky'),sx=sk.getContext('2d');let stars=[],shoots=[],T=0;
function skySize(){sk.width=innerWidth;sk.height=innerHeight;
  stars=Array.from({length:Math.floor(innerWidth*innerHeight/3000)},()=>({x:Math.random()*sk.width,y:Math.random()*sk.height,r:Math.random()*1.6+.3,p:Math.random()*6.28,s:.01+Math.random()*.04,c:Math.random()<.3?'170,205,255':'255,255,255'}))}
skySize();addEventListener('resize',skySize);
(function sky(){T++;const w=sk.width,h=sk.height;
  const g=sx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#01020a');g.addColorStop(.6,'#040a26');g.addColorStop(1,'#08186a');
  sx.fillStyle=g;sx.fillRect(0,0,w,h);
  [[.18+.06*Math.sin(T/180),.92,.55,'40,110,255'],[.82+.05*Math.cos(T/220),.2,.45,'90,70,255'],[.5,1.05,.75,'0,160,255']].forEach(([x,y,r,c])=>{
    const rg=sx.createRadialGradient(x*w,y*h,0,x*w,y*h,r*Math.max(w,h));rg.addColorStop(0,`rgba(${c},.3)`);rg.addColorStop(1,`rgba(${c},0)`);sx.fillStyle=rg;sx.fillRect(0,0,w,h)});
  stars.forEach(s=>{s.p+=s.s;const a=.35+.65*Math.abs(Math.sin(s.p));
    sx.fillStyle=`rgba(${s.c},${a})`;
    if(s.r>1.3){sx.shadowColor=`rgba(${s.c},1)`;sx.shadowBlur=10}
    sx.beginPath();sx.arc(s.x,s.y,s.r*(.8+.4*a),0,6.28);sx.fill();sx.shadowBlur=0});
  if(Math.random()<.006)shoots.push({x:Math.random()*w+w*.2,y:Math.random()*h*.4,l:0});
  shoots=shoots.filter(t=>t.l<50);
  shoots.forEach(t=>{t.l++;t.x-=16;t.y+=7;const gr=sx.createLinearGradient(t.x,t.y,t.x+90,t.y-40);
    gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(1,'rgba(255,255,255,0)');
    sx.strokeStyle=gr;sx.lineWidth=2;sx.beginPath();sx.moveTo(t.x,t.y);sx.lineTo(t.x+90,t.y-40);sx.stroke()});
  requestAnimationFrame(sky)})();

// ---- start gate + background music (browsers only allow sound after a tap) ----
$('sh').textContent = "A birthday surprise for "+NAME;
const bgm=$('bgm'), mute=$('mute'); bgm.src=AUDIO;
let fade;
function fadeIn(){ bgm.volume=0; clearInterval(fade);
  fade=setInterval(()=>{ bgm.volume=Math.min(MUSIC_VOLUME,bgm.volume+.03); if(bgm.volume>=MUSIC_VOLUME) clearInterval(fade); },120); }
$('go').onclick=()=>{
  $('start').classList.add('hide'); setTimeout(()=>$('start').remove(),1000);
  bgm.play().then(()=>{ fadeIn(); mute.classList.add('on'); }).catch(()=>{});   // silently skipped if a.mp3 is missing
  play();
};
mute.onclick=()=>{ bgm.muted=!bgm.muted; mute.textContent=bgm.muted?'🔇':'🔊'; };
document.addEventListener('visibilitychange',()=>{ if(document.hidden) bgm.pause(); else if(mute.classList.contains('on')) bgm.play().catch(()=>{}); });
</script>
</body>
</html>
